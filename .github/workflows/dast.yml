name: DAST (ZAP Baseline)
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write        # ZAP action opens/updates the "ZAP Scan Baseline Report" issue

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run app
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-only-ephemeral-key' }}
        run: |
          pip install -r requirements.txt
          python src/db.py
          nohup python -m flask --app src/app.py run --host=127.0.0.1 --port=5000 > flask.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:5000/ >/dev/null && break; sleep 1; done
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://127.0.0.1:5000'
          cmd_options: '-a -j'
          issue_title: 'ZAP Scan Baseline Report'
          artifact_name: 'zap-report'
          fail_action: false
